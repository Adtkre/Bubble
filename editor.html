<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble — Visual Mobile App & Dart Studio</title>
  <meta name="description" content="Visual block-based mobile app development and learning platform that teaches beginners app development through blocks and Dart code generation.">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/blocks.css">
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="editor-app">

  <!-- 1. Top Editor Toolbar -->
  <header class="editor-toolbar">
    <div class="toolbar-left">
      <a href="dashboard.html" class="btn btn-secondary btn-sm" title="Return to Dashboard">
        <span>← App Dashboard</span>
      </a>

      <div class="toolbar-divider"></div>

      <div class="brand-logo-icon" style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
      </div>
      <div id="editor-project-title" class="project-title-editor" title="Click to rename project">My Flutter App</div>

      <div class="save-status-pill" id="save-status-pill">
        <span class="save-dot" style="background-color: var(--color-success);"></span>
        <span id="save-status-text">All changes saved</span>
      </div>
    </div>

    <!-- Center Toolbar: Undo/Redo, Mini-Project Selector -->
    <div class="toolbar-center">
      <div style="display: flex; gap: 2px;">
        <button class="btn btn-secondary btn-sm" id="btn-undo" title="Undo (Ctrl+Z)" disabled>
          <span>↩</span>
        </button>
        <button class="btn btn-secondary btn-sm" id="btn-redo" title="Redo (Ctrl+Y)" disabled>
          <span>↪</span>
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Quick Guided Mini-Project Template Selector -->
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 12px; font-weight: 600; color: var(--color-text-muted);">Starter App:</span>
        <select id="select-tutorial-template" class="form-select" style="padding: 4px 8px; font-size: 12px; width: 170px;">
          <option value="">Load Template...</option>
          <option value="hello_world">Hello World</option>
          <option value="counter_app">Counter App</option>
          <option value="calculator_app">Calculator App</option>
          <option value="login_form">Login Form</option>
          <option value="todo_app">To-Do List</option>
          <option value="blank_app">Blank App</option>
        </select>
      </div>
    </div>

    <!-- Right Toolbar: Code Explorer Toggle, Learn Guide, Download Dart -->
    <div class="toolbar-right">
      <button class="btn btn-primary btn-sm" id="btn-toggle-code-explorer" title="Inspect Generated Flutter Dart Code">
        <span>&lt;/&gt; Generated Dart</span>
      </button>

      <button class="btn btn-secondary btn-sm" id="btn-open-learn-mode" title="Flutter & Dart Concept Guides" style="display: inline-flex; align-items: center; gap: 5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        <span>Tutorials</span>
      </button>

      <button class="btn btn-secondary btn-sm" id="btn-export-dart" title="Download main.dart file for Flutter" style="display: inline-flex; align-items: center; gap: 5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>main.dart</span>
      </button>

      <button class="btn btn-subtle btn-sm" id="btn-export-json" title="Download Project JSON Backup" style="display: inline-flex; align-items: center; gap: 5px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>JSON</span>
      </button>

      <div class="toolbar-divider"></div>
      <div id="auth-nav-container"></div>
    </div>
  </header>

  <!-- 2. Main 4-Area Editor Body -->
  <div class="editor-body">

    <!-- Area 1: Left Panel — Dart Block Library -->
    <aside class="editor-sidebar-left" style="width: 280px;">
      <div style="padding: 12px 14px; border-bottom: 1px solid var(--color-border); font-size: 13px; font-weight: 700; color: var(--color-text-main); display: flex; align-items: center; justify-content: space-between;">
        <span style="display: inline-flex; align-items: center; gap: 6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.439 7.85c-.049-.913-.772-1.637-1.685-1.686a2.235 2.235 0 0 1-2.128-2.128c-.049-.913-.773-1.637-1.686-1.686C13.027 2.3 12 3.1 12 4.1a2 2 0 0 1-4 0c0-1-.973-1.8-1.94-1.75-.913.049-1.637.773-1.686 1.686A2.235 2.235 0 0 1 2.246 6.164c-.913.049-1.637.773-1.686 1.686.05 1 .85 2.05 1.85 2.05a2 2 0 0 1 0 4c-1 0-1.8.95-1.85 1.95.049.913.773 1.637 1.686 1.686a2.235 2.235 0 0 1 2.128 2.128c.049.913.773 1.637 1.686 1.686.967.05 1.94-.75 1.94-1.75a2 2 0 0 1 4 0c0 1 1.027 1.8 1.94 1.75.913-.049 1.637-.773 1.686-1.686a2.235 2.235 0 0 1 2.128-2.128c.913-.049 1.637-.773 1.686-1.686-.05-1-.85-1.95-1.85-1.95a2 2 0 0 1 0-4c1 0 1.8-1.05 1.85-2.05z"/></svg>
          Dart Block Library
        </span>
        <span class="badge badge-accent">Flutter</span>
      </div>

      <div class="library-search-box">
        <input type="text" id="library-search-input" class="form-input" placeholder="Search blocks & widgets..." />
      </div>

      <div class="library-content" id="block-library-categories">
        <!-- Rendered dynamically by editor.js with 12 categories -->
      </div>
    </aside>

    <!-- Area 2: Center Panel — Visual Block Workspace -->
    <main class="editor-canvas-container" style="padding: 0; background-color: #f8fafc;">
      <div class="workspace-canvas-surface" id="workspace-canvas-surface">
        <!-- Connected visual blocks with puzzle notches & C-clamps -->
      </div>
    </main>

    <!-- Area 3: Right Panel — Live Mobile Preview & Properties Inspector -->
    <aside class="phone-preview-panel">
      <div class="preview-panel-header">
        <div style="font-size: 13px; font-weight: 700; color: var(--color-text-main);">Live Phone Simulator</div>
        <div class="preview-badge-flutter">Interactive</div>
      </div>

      <!-- Smartphone Bezel Mockup -->
      <div class="mobile-device-chassis">
        <div class="mobile-screen">
          <!-- Status Bar -->
          <div class="mobile-status-bar">
            <span>9:41</span>
            <div class="status-notch"></div>
            <div class="status-icons">5G ■</div>
          </div>

          <!-- Interactive Simulated Screen -->
          <div id="mobile-screen-content" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
            <!-- Rendered by mobile-preview.js -->
          </div>
        </div>
        <!-- Home indicator -->
        <div class="mobile-home-indicator"></div>
      </div>

      <!-- Block Property Editor Accordion / Drawer below Phone -->
      <div id="inspector-container" style="width: 100%; margin-top: 24px; border-top: 1px solid var(--color-border); padding-top: 16px;">
        <!-- Rendered by properties.js -->
      </div>
    </aside>

    <!-- Area 4: Bottom Collapsible Panel — Dart Code Explorer -->
    <section class="code-explorer-drawer open" id="code-explorer-drawer">
      <div class="code-drawer-header">
        <div class="code-tabs">
          <button class="code-tab-btn active" data-tab="dart" style="display: inline-flex; align-items: center; gap: 5px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>main.dart (Flutter)</span>
          </button>
          <button class="code-tab-btn" data-tab="explanations" style="display: inline-flex; align-items: center; gap: 5px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            <span>How this Code Works</span>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 11px; color: #94a3b8;">Synchronized with visual blocks</span>
          <button class="btn btn-subtle btn-sm" id="btn-copy-dart-code" style="color: #cbd5e1; display: inline-flex; align-items: center; gap: 5px;" title="Copy to clipboard">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span>Copy Dart</span>
          </button>
          <button class="btn btn-subtle btn-sm" id="btn-download-dart-file" style="color: #cbd5e1; display: inline-flex; align-items: center; gap: 5px;" title="Download main.dart">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span>Download</span>
          </button>
          <button class="btn btn-subtle btn-sm" id="btn-close-code-drawer" style="color: #cbd5e1;" title="Toggle code drawer" aria-label="Close">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="code-viewer-container" id="code-viewer-container">
        <!-- Rendered with syntax highlighting and source mapping -->
      </div>
    </section>

  </div>

  <!-- Modal: Guided Tutorials & Learn Mode -->
  <div class="modal-backdrop" id="learn-modal">
    <div class="modal-card learn-modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <span style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            Flutter & Dart App Studio Tutorials
          </span>
        </div>
        <button class="btn btn-subtle btn-sm" id="btn-close-learn-modal" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="learn-modal-body">
        <!-- Guided projects loaded here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('learn-modal').classList.remove('active')">Close</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/block-definitions.js"></script>
  <script src="js/dart-generator.js"></script>
  <script src="js/tutorials.js"></script>
  <script src="js/dart-learn.js"></script>
  <script src="js/history.js"></script>
  <script src="js/mobile-preview.js"></script>
  <script src="js/block-workspace.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/code-explorer.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
